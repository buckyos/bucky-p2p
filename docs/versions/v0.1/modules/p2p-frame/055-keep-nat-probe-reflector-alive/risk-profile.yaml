    evidence: ["pipeline/plan.md#exported-interfaces", "pipeline/plan.md#api-and-build-surface-impact", "pipeline/plan.md#implementation-scope-bindings"]
    required_checks: ["NatProbeReflector::run 公共签名保持不变", "现有 SN service 与 crate 内调用方继续使用原 API 编译", "公开运行时语义只放宽 send_to 错误恢复，不改变 recv_from 与协议错误边界"]
