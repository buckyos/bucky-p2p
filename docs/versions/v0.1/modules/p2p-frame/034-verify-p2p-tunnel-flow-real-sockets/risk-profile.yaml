schema_version: 1
task_manifest: task.yaml
change_ids: ["real_socket_tunnel_flow_strategy_selection", "real_socket_tunnel_flow_fallbacks", "real_socket_tunnel_flow_collision_cross_sn"]
source_bindings:
  proposal: proposal.md
  design_source: pipeline/plan.md
risks:
  contract:
    applies: false
    evidence: The task observes existing SN rendezvous, legacy SnCall, PN proxy, inter-SN, and tunnel contracts without changing public APIs or wire formats.
    required_checks: []
  data:
    applies: false
    evidence: Test fixtures and run artifacts are ephemeral and introduce no product persistence, schema, migration, serialization, or cache-key behavior.
    required_checks: []
  security:
    applies: false
    evidence: The isolated topology uses generated identities and loopback sockets without credentials, authorization changes, private user data, or a new external trust boundary.
    required_checks: []
  runtime:
    applies: true
    evidence: The formal evidence exercises real socket lifecycle, timeout, fallback, concurrency, proxy, and inter-SN control flows across p2p-frame runtime modules.
    required_checks:
      - Real SN and P2pStack socket paths record selected, request-sent, action-armed, fallback, connected, and payload-complete boundaries accurately.
      - Six strategy conditions record the public-rule expected operation; locally rejected loopback cases record the pre-request boundary and do not claim actual selection, request transmission, punch packets, or peer tunnel success.
      - Direct, legacy, and PN proxy representative success and failure semantics are bounded and distinguish control-plane progress from data-plane completion.
      - Simultaneous connect preserves a stable caller-visible winner and bounded cleanup.
      - Cross-SN coverage uses the production TTP inter-SN path.
  build:
    applies: false
    evidence: The task adds only dedicated p2p-frame test sources and task runner metadata without changing production dependencies, features, packaging, release outputs, or defaults.
    required_checks: []
  ui:
    applies: false
    evidence: No UI, navigation, accessibility, localization, or user workflow is changed.
    required_checks: []
  harness:
    applies: false
    evidence: The task consumes the installed Harness lifecycle and unified runner without changing Harness rules, scripts, templates, or semantics.
    required_checks: []
